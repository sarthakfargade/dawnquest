<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DawnQuest — Instructor Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1B2A4A;
            --parchment: #FBF7EF;
            --parchment-dim: #F2ECDD;
            --gold: #C69749;
            --gold-deep: #A97B34;
            --line: #DDD3BF;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--ink);
            background-image:
                radial-gradient(circle at 15% 20%, rgba(198,151,73,0.18), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(198,151,73,0.10), transparent 45%);
            font-family: 'IBM Plex Sans', sans-serif;
            color: var(--ink);
        }

        .card {
            background: var(--parchment);
            width: 380px;
            max-width: 90vw;
            padding: 44px 40px 36px;
            border-radius: 4px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.35);
            position: relative;
        }

        .eyebrow {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--gold-deep);
            margin: 0 0 6px;
        }

        h1 {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 28px;
            margin: 0 0 28px;
            line-height: 1.15;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: #6b5f4f;
            margin-top: 18px;
            margin-bottom: 6px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 3px;
            background: #fff;
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 14px;
            color: var(--ink);
        }

        input[type="text"]:focus, input[type="password"]:focus {
            outline: 2px solid var(--gold);
            outline-offset: 1px;
            border-color: var(--gold);
        }

        button {
            width: 100%;
            margin-top: 26px;
            padding: 13px;
            background: var(--ink);
            color: var(--parchment);
            border: none;
            border-radius: 3px;
            font-family: 'IBM Plex Sans', sans-serif;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        button:hover { background: #0f1c33; }

        .error {
            background: #fbeae6;
            border: 1px solid #e3b6a8;
            color: #a5402a;
            font-size: 13px;
            padding: 10px 12px;
            border-radius: 3px;
            margin: 0 0 6px;
        }

        .footnote {
            margin-top: 22px;
            font-size: 12px;
            color: #8a7d68;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <p class="eyebrow">DawnQuest · Learning Center</p>
        <h1>Instructor sign-in</h1>

        {% if form.errors %}
            <p class="error">Incorrect username or password. Please try again.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label for="id_username">Username</label>
            <input type="text" name="username" id="id_username" required autofocus>

            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password" required>

            <button type="submit">Sign in</button>
            <input type="hidden" name="next" value="{{ next }}">
        </form>

        <p class="footnote">Paper generation is available to signed-in instructors only.</p>
    </div>
</body>
</html>
